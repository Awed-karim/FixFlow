# بيحدد نوع الاتصال: لو الطلب WebSocket نرفعه (upgrade)، غير كده نقفل عادي
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # الصور المرفوعة حد أقصاها 5MB، فنسمح بـ 6MB
    client_max_body_size 6m;

    # ---------- الـ API ----------
    # "api" هو اسم الخدمة في docker-compose، وDocker بيحوّله لعنوانها تلقائياً
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- الصور المرفوعة ----------
    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # ---------- SignalR (WebSocket) ----------
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- ملفات React ----------
    # الملفات اللي اسمها فيه Hash بتتخزن في المتصفح سنة
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # أي رابط تاني (زي /requests/5 أو /track/xxx) نرجّع index.html
    # وReact Router هو اللي يعرف يعرض الصفحة الصح
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}