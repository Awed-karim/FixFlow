name: fixflow

services:
  # ---------- الداتابيز ----------
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express          # نسخة مجانية وأخف في الرام
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?اكتب SA_PASSWORD في ملف .env}
    volumes:
      - sqldata:/var/opt/mssql    # الداتا بتفضل حتى لو الحاوية اتمسحت
    healthcheck:                  # "أنا جاهز؟" بيتفحص كل 10 ثواني
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  # ---------- الـ API ----------
  api:
    build:
      context: .
      dockerfile: src/FixFlow.API/Dockerfile
    depends_on:
      db:
        condition: service_healthy   # متشتغلش غير لما الداتابيز تبقى جاهزة
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # "db" هو اسم خدمة الداتابيز فوق. Docker بيحوّله لعنوانها
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=FixFlowDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?اكتب JWT_KEY في ملف .env}
      SeedAdmin__Email: ${ADMIN_EMAIL:-admin@fixflow.com}
      SeedAdmin__Password: ${ADMIN_PASSWORD:?اكتب ADMIN_PASSWORD في ملف .env}
      App__TrackingBaseUrl: ${PUBLIC_URL:-http://localhost}/track
      Webhook__Enabled: ${WEBHOOK_ENABLED:-false}
      Webhook__Url: ${WEBHOOK_URL:-}
      Webhook__Secret: ${WEBHOOK_SECRET:-change-me-webhook-secret}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
    volumes:
      - uploads:/app/uploads         # الصور المرفوعة بتفضل
    ports:
      - "127.0.0.1:5080:8080"        # للتجربة المباشرة (Swagger) من جهازك بس
    restart: unless-stopped

  # ---------- الفرونت ----------
  client:
    build: ./client
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

volumes:
  sqldata:
  uploads: